<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EDEDED"><title>小手机 · WeChat 文游</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#EDEDED;--white:#FFF;--green:#07C160;--text:#191919;--muted:#888;--line:#E5E5E5;--icon:#333;--danger:#FA5151}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}svg{width:20px;height:20px;stroke:#333;stroke-width:1.9}
#app{min-height:100vh;display:flex;justify-content:center;background:#000}.phone{width:min(100%,430px);min-height:100vh;background:var(--bg);position:relative;overflow:hidden}.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg);font-size:13px;font-weight:600}.topbar{height:52px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.04)}.topbar h1{font-size:18px;font-weight:600;margin:0}.top-actions{display:flex;gap:3px}.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}.iconbtn:active{background:rgba(0,0,0,.08)}
.screen{height:calc(100vh - 132px);overflow:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.page-pad{padding:8px 0}.gap{height:8px;background:var(--bg)}.list{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.row{width:100%;height:52px;display:flex;align-items:center;padding:0 16px;background:#fff;border-bottom:1px solid #f0f0f0;text-align:left}.row:last-child{border-bottom:0}.row .leading{width:20px;flex:none;display:grid;place-items:center;margin-right:12px}.row .body{flex:1;min-width:0;font-size:16px}.row .trailing{display:flex;align-items:center;gap:8px;color:#888;font-size:13px}.row .chev svg{color:#aaa;width:18px;height:18px}
.profile{height:120px;background:#fff;padding:16px;display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:12px;background:#ddd;overflow:hidden;display:grid;place-items:center;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.initial{font-size:24px;font-weight:600;color:#666}.profile .name{font-size:20px;font-weight:700}.profile .meta{font-size:14px;color:#888;margin-top:6px}.profile .idline{font-size:12px;color:#aaa;margin-top:4px}
.chat-item{position:relative;width:100%;height:72px;padding:10px 14px;display:flex;gap:12px;background:#fff;border-bottom:1px solid #f0f0f0;text-align:left}.chat-avatar{width:50px;height:50px;border-radius:9px;background:#ddd;overflow:visible;flex:none;display:grid;place-items:center}.chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:9px}.chat-main{min-width:0;flex:1}.chat-name{font-size:16px;font-weight:500;margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:11px;color:#aaa}.unread{position:absolute;right:13px;top:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--green);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:50px;padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box;background:#fff;border-top:1px solid #ddd;display:flex}.tab{height:50px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#7A7E83;font-size:10px}.tab svg{width:20px;height:20px;stroke:#7A7E83}.tab.active{color:#07C160}.tab.active svg{stroke:#07C160}
.cover{height:135px;background:#ddd center/cover no-repeat}.moments-head{height:70px;background:#fff;position:relative}.moments-avatar{position:absolute;right:16px;top:-30px;width:64px;height:64px;border-radius:10px;border:3px solid #fff;object-fit:cover;background:#ddd}.moments-name{position:absolute;right:92px;top:9px;font-weight:600}.post{background:#fff;margin-top:8px;padding:16px;display:flex;gap:12px}.post .avatar{width:44px;height:44px;border-radius:8px}.post-content{min-width:0;flex:1}.post-name{color:#576b95;font-weight:600;font-size:15px;margin-bottom:8px}.post-text{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.post-meta{font-size:11px;color:#aaa;margin-top:10px}
.empty{padding:60px 20px;text-align:center;color:#aaa}.empty svg{margin-bottom:12px;stroke:#aaa}.settings-title{padding:14px 16px 7px;color:#888;font-size:13px}.resource-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px;margin-bottom:8px}.resource-card b{font-size:15px}.resource-card p{margin:6px 0;color:#888;font-size:12px}.small{font-size:12px;line-height:1.5;color:#888}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(100%,430px);max-height:88vh;overflow:auto;background:#f7f7f7;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}.sheet-head{height:54px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 8px}.sheet-head b{font-size:17px}.sheet-body{padding:16px}.label{font-size:13px;color:#777;margin:0 0 7px}.field{width:100%;background:#fff;border:1px solid #ddd;border-radius:8px;padding:11px 12px;outline:none;margin-bottom:13px}.field:focus{border-color:#aaa}.btn{width:100%;height:46px;border-radius:8px;background:#07C160;color:#fff;font-weight:600;margin-top:6px}.btn.secondary{background:#fff;color:#333;border:1px solid #ddd}.btn.danger{background:#fff;color:#FA5151;border:1px solid #eee}.inline{display:flex;gap:8px}.inline>*{flex:1}.file{display:none}
.chatview{position:absolute;inset:82px 0 0;background:#EDEDED;z-index:20;display:none;flex-direction:column}.chatview.show{display:flex}.chathead{height:52px;background:#EDEDED;border-bottom:1px solid #d7d7d7;display:flex;align-items:center;padding:0 8px}.chathead .title{flex:1;text-align:center;font-size:17px;font-weight:600}.messages{flex:1;overflow:auto;padding:10px}.bubble-row{display:flex;gap:8px;margin:10px 0}.bubble-row.me{justify-content:flex-end}.bubble-avatar{width:40px;height:40px;border-radius:7px;background:#ddd;overflow:hidden;flex:none}.bubble-avatar img{width:100%;height:100%;object-fit:cover}.bubble{max-width:75%;padding:9px 11px;border-radius:4px;background:#fff;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.me .bubble{background:#95EC69}.composer{min-height:54px;background:#f7f7f7;border-top:1px solid #ddd;padding:7px;display:flex;gap:7px;align-items:flex-end}.composer textarea{flex:1;min-height:38px;max-height:110px;border:1px solid #ddd;border-radius:6px;padding:8px;resize:none;outline:none}.send{height:38px;padding:0 13px;border-radius:5px;background:#07C160;color:#fff;font-size:14px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:rgba(0,0,0,.76);color:#fff;padding:9px 13px;border-radius:7px;font-size:13px;z-index:100;display:none}.toast.show{display:block}
</style></head><body>
<div id="app"><div class="phone" id="phone"><div class="status"><span id="clock">--:--</span><span>● ● ●　⌁　▮</span></div><header class="topbar"><h1 id="title">聊天</h1><div class="top-actions"><button class="iconbtn" id="search"><i data-lucide="search"></i></button><button class="iconbtn" id="add"><i data-lucide="plus"></i></button></div></header><main class="screen" id="screen"></main><nav class="tabbar"><button class="tab active" data-page="chats"><i data-lucide="message-circle"></i><span>聊天</span></button><button class="tab" data-page="moments"><i data-lucide="compass"></i><span>朋友圈</span></button><button class="tab" data-page="me"><i data-lucide="user"></i><span>我</span></button></nav>
<section class="chatview" id="chatview"><div class="chathead"><button class="iconbtn" id="back"><i data-lucide="chevron-left"></i></button><div class="title" id="chatname"></div><button class="iconbtn" id="more"><i data-lucide="more-horizontal"></i></button></div><div class="messages" id="messages"></div><div class="composer"><button class="iconbtn" id="attach"><i data-lucide="plus"></i></button><textarea id="input" placeholder="输入消息"></textarea><button class="send" id="send">发送</button></div></section></div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><button class="iconbtn" id="modalx"><i data-lucide="x"></i></button><b id="modaltitle">设置</b><span style="width:38px"></span></div><div class="sheet-body" id="modalbody"></div></div></div><div class="toast" id="toast"></div>
<input id="imgpick" class="file" type="file" accept="image/*"><input id="jsonpick" class="file" type="file" accept=".json,application/json">
<script>
const KEY='wechat_roleplay_final_v3';
const seed={user:{name:'用户',subtitle:'微信文游用户',id:'user_001',note:'',avatar:''},settings:{apiBase:'https://api.openai.com/v1',apiKey:'',model:'gpt-4o-mini',wallpaper:'',cover:''},chars:[],chats:{},posts:[],resources:{presets:[],regex:[],worldbooks:[]}};
let state=load(),page='chats',current=null,imageMode='';
function load(){try{return Object.assign(structuredClone(seed),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function I(n){return '<i data-lucide="'+n+'"></i>'}function icons(){if(window.lucide)lucide.createIcons({attrs:{width:20,height:20}})}
function av(o,cls='avatar'){return o.avatar?'<img class="'+cls+'" src="'+esc(o.avatar)+'" alt="">':'<div class="'+cls+'"><span class="initial">'+esc((o.name||'U').slice(0,1))+'</span></div>'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,1000);clock();
function render(){document.getElementById('title').textContent=page==='chats'?'聊天':page==='moments'?'朋友圈':'我';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let s=document.getElementById('screen');page==='chats'?chats(s):page==='moments'?moments(s):me(s);icons()}
function chats(s){let rows=state.chars.map(c=>'<button class="chat-item" data-id="'+esc(c.id)+'">'+av(c,'chat-avatar')+'<div class="chat-main"><div class="chat-name">'+esc(c.note||c.name)+'</div><div class="preview">'+esc((state.chats[c.id]?.at(-1)?.content)||'暂无消息')+'</div></div>'+(c.unread?'<span class="unread">'+(c.unread>99?'99+':c.unread)+'</span>':'')+'</button>').join('');s.innerHTML='<div class="page-pad"><div class="list">'+(rows||'<div class="empty">'+I('message-circle')+'<div>暂无角色，点击右上角 + 导入角色卡</div></div>')+'</div></div>';s.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openChat(x.dataset.id))}
function moments(s){let u=state.user;s.innerHTML='<div class="cover" style="'+(state.settings.cover?'background-image:url('+JSON.stringify(state.settings.cover)+')':'')+'"></div><div class="moments-head">'+av(u,'moments-avatar')+'<div class="moments-name">'+esc(u.name)+'</div></div>'+state.posts.map(p=>'<div class="post">'+av(p,'avatar')+'<div class="post-content"><div class="post-name">'+esc(p.name)+'</div><div class="post-text">'+esc(p.text)+'</div><div class="post-meta">'+esc(p.time||'刚刚')+'</div></div></div>').join('')}
function me(s){let u=state.user;let count=state.resources.presets.length+state.resources.regex.length+state.resources.worldbooks.length;s.innerHTML='<div class="page-pad"><button class="profile" id="profile">'+av(u)+'<div><div class="name">'+esc(u.name)+'</div><div class="meta">'+esc(u.subtitle||'')+'</div><div class="idline">微信号：'+esc(u.id)+'</div></div><span style="margin-left:auto;color:#aaa">'+I('chevron-right')+'</span></button><div class="gap"></div><div class="list"><button class="row" data-a="profile"><span class="leading">'+I('user-round')+'</span><span class="body">个人信息</span><span class="chev">'+I('chevron-right')+'</span></button><button class="row" data-a="resources"><span class="leading">'+I('library')+'</span><span class="body">资源管理</span><span class="trailing">'+(count||'未配置')+' <span class="chev">'+I('chevron-right')+'</span></span></button></div><div class="gap"></div><div class="list"><button class="row" data-a="bg"><span class="leading">'+I('image')+'</span><span class="body">聊天背景</span><span class="chev">'+I('chevron-right')+'</span></button><button class="row" data-a="api"><span class="leading">'+I('key-round')+'</span><span class="body">API 与模型</span><span class="trailing">'+(state.settings.apiKey?'已配置':'未配置')+' <span class="chev">'+I('chevron-right')+'</span></span></button><button class="row" data-a="import"><span class="leading">'+I('file-plus-2')+'</span><span class="body">导入角色卡 / 资源</span><span class="chev">'+I('chevron-right')+'</span></button></div><div class="gap"></div><div class="list"><button class="row" data-a="export"><span class="leading">'+I('download')+'</span><span class="body">导出本地数据</span><span class="chev">'+I('chevron-right')+'</span></button><button class="row" data-a="reset"><span class="leading">'+I('trash-2')+'</span><span class="body">清空全部本地数据</span><span class="chev">'+I('chevron-right')+'</span></button></div></div>';s.querySelector('#profile').onclick=openProfile;s.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>action(x.dataset.a))}
function action(a){if(a==='profile')openProfile();if(a==='resources')openResources();if(a==='bg')openBackground();if(a==='api')openAPI();if(a==='import')document.getElementById('jsonpick').click();if(a==='export')exportData();if(a==='reset'&&confirm('确定清空全部本地数据吗？')){localStorage.removeItem(KEY);state=load();render();toast('已清空')}}
function modal(title,html){document.getElementById('modaltitle').textContent=title;document.getElementById('modalbody').innerHTML=html;document.getElementById('modal').classList.add('show');icons()}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modalx').onclick=closeModal;
function openProfile(){modal('个人信息','<div class="label">头像</div><button class="avatar" id="ua" style="width:72px;height:72px;margin-bottom:14px">'+av(state.user).replace('class="avatar"','class="avatar"')+'</button><div class="label">昵称</div><input class="field" id="un" value="'+esc(state.user.name)+'"><div class="label">副标题</div><input class="field" id="us" value="'+esc(state.user.subtitle)+'"><div class="label">用户 ID / 微信号</div><input class="field" id="ui" value="'+esc(state.user.id)+'"><div class="label">备注</div><input class="field" id="unote" value="'+esc(state.user.note)+'"><button class="btn" id="saveu">保存</button>');document.getElementById('ua').onclick=()=>pick('user');document.getElementById('saveu').onclick=()=>{state.user.name=document.getElementById('un').value||'用户';state.user.subtitle=document.getElementById('us').value;state.user.id=document.getElementById('ui').value;state.user.note=document.getElementById('unote').value;save();closeModal();render();toast('个人信息已保存')}}
function openResources(){let block=(k,n)=>'<div class="settings-title">'+n+'（'+state.resources[k].length+'）</div>'+(state.resources[k].map((r,i)=>'<div class="resource-card"><b>'+esc(r.name||'未命名')+'</b><p>'+esc(r.description||'已导入资源')+'</p><button class="btn danger" style="height:38px" onclick="delRes(\''+k+'\','+i+')">删除</button></div>').join('')||'<div class="small">暂无资源</div>');modal('资源管理','<button class="btn" id="ir">导入 JSON 资源</button>'+block('presets','预设')+block('worldbooks','世界书')+block('regex','正则'));document.getElementById('ir').onclick=()=>document.getElementById('jsonpick').click()}
window.delRes=(k,i)=>{state.resources[k].splice(i,1);save();openResources();toast('已删除')}
function openBackground(){modal('聊天背景',(state.settings.wallpaper?'<img src="'+esc(state.settings.wallpaper)+'" style="width:100%;height:180px;object-fit:cover;border-radius:8px">':'')+'<button class="btn" id="pickbg">从相册选择</button><button class="btn secondary" id="clearbg">恢复默认</button>');document.getElementById('pickbg').onclick=()=>pick('wallpaper');document.getElementById('clearbg').onclick=()=>{state.settings.wallpaper='';save();closeModal();toast('已恢复默认')}}
function openAPI(){modal('API 与模型','<div class="label">Base URL</div><input class="field" id="base" value="'+esc(state.settings.apiBase)+'"><div class="label">API Key</div><input class="field" id="key" type="password" value="'+esc(state.settings.apiKey)+'"><div class="label">Model</div><input class="field" id="model" value="'+esc(state.settings.model)+'"><div class="small">浏览器直连 API 可能受到 CORS 限制。Key 只保存在本机浏览器。</div><button class="btn" id="saveapi">保存</button>');document.getElementById('saveapi').onclick=()=>{state.settings.apiBase=document.getElementById('base').value.replace(/\/$/,'');state.settings.apiKey=document.getElementById('key').value;state.settings.model=document.getElementById('model').value;save();closeModal();render();toast('API 设置已保存')}}
function pick(mode){imageMode=mode;document.getElementById('imgpick').click()}document.getElementById('imgpick').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{if(imageMode==='user')state.user.avatar=r.result;if(imageMode==='wallpaper')state.settings.wallpaper=r.result;if(imageMode.startsWith('char:')){let c=state.chars.find(x=>x.id===imageMode.slice(5));if(c)c.avatar=r.result}save();closeModal();render();toast('图片已更新')};r.readAsDataURL(f);e.target.value=''};
function importJSON(d){let c=d.data||d;if(c.name&&(c.first_mes||c.description||c.personality||d.spec)){let id='char_'+Date.now();state.chars.unshift({id,name:c.name,note:c.name,avatar:'',description:c.description||'',card:c,unread:0});state.chats[id]=c.first_mes?[{role:'assistant',content:c.first_mes}]:[];save();render();toast('角色卡已导入');return}if(d.prompts){state.resources.presets.unshift({name:d.name||'未命名预设',description:'Prompt 模块：'+d.prompts.length,data:d});if(d.extensions?.regex)state.resources.regex.unshift({name:(d.name||'预设')+' 正则',description:'来自 preset.extensions.regex',data:d.extensions.regex});if(d.extensions?.lorebook||d.lorebook||d.data?.lorebook)state.resources.worldbooks.unshift({name:(d.name||'预设')+' 世界书',description:'检测到 Lorebook 数据',data:d.extensions?.lorebook||d.lorebook||d.data.lorebook});save();render();toast('预设已导入');return}if(d.lorebook||d.entries||d.data?.entries){state.resources.worldbooks.unshift({name:d.name||'世界书',description:'Lorebook 条目：'+(d.entries?.length||d.data?.entries?.length||0),data:d});save();render();toast('世界书已导入');return}if(d.regex||d.extensions?.regex){state.resources.regex.unshift({name:d.name||'正则',description:'Regex 规则',data:d.regex||d.extensions.regex});save();render();toast('正则已导入');return}toast('无法识别资源类型')}
document.getElementById('jsonpick').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{importJSON(JSON.parse(r.result))}catch(err){toast('JSON 无法解析')}e.target.value=''};r.readAsText(f)};
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='wechat-roleplay-data.json';a.click()}
function openChat(id){current=id;let c=state.chars.find(x=>x.id===id);if(!c)return;c.unread=0;save();document.getElementById('chatname').textContent=c.note||c.name;document.getElementById('chatview').classList.add('show');renderMessages()}
function renderMessages(){let c=state.chars.find(x=>x.id===current);if(!c)return;let b=document.getElementById('messages');b.style.background=state.settings.wallpaper?'url('+JSON.stringify(state.settings.wallpaper)+') center/cover fixed':'#EDEDED';b.innerHTML=(state.chats[current]||[]).map(m=>'<div class="bubble-row '+(m.role==='user'?'me':'')+'">'+(m.role==='user'?'':av(c,'bubble-avatar'))+'<div class="bubble">'+esc(m.content)+'</div>'+(m.role==='user'?av(state.user,'bubble-avatar'):'')+'</div>').join('');b.scrollTop=b.scrollHeight}
document.getElementById('back').onclick=()=>document.getElementById('chatview').classList.remove('show');document.getElementById('more').onclick=()=>openChar(current);
function openChar(id){let c=state.chars.find(x=>x.id===id);if(!c)return;modal('角色资料','<div style="display:flex;justify-content:center">'+av(c)+'</div><div class="label">角色名称</div><input class="field" id="cn" value="'+esc(c.name)+'"><div class="label">备注 / 显示名</div><input class="field" id="ct" value="'+esc(c.note||'')+'"><div class="label">角色 ID</div><input class="field" id="ci" value="'+esc(c.id)+'"><div class="label">简介</div><textarea class="field" id="cd">'+esc(c.description||'')+'</textarea><button class="btn secondary" id="ca">更换角色头像</button><button class="btn" id="sc">保存</button><button class="btn danger" id="dc">删除角色及聊天记录</button>');document.getElementById('ca').onclick=()=>pick('char:'+id);document.getElementById('sc').onclick=()=>{c.name=document.getElementById('cn').value||'未命名角色';c.note=document.getElementById('ct').value;c.description=document.getElementById('cd').value;let old=id,newid=document.getElementById('ci').value||id;if(newid!==old){c.id=newid;state.chats[newid]=state.chats[old]||[];delete state.chats[old]}save();closeModal();document.getElementById('chatname').textContent=c.note||c.name;render();renderMessages();toast('角色信息已保存')};document.getElementById('dc').onclick=()=>{if(confirm('确定删除这个角色及全部聊天记录吗？')){state.chars=state.chars.filter(x=>x.id!==id);delete state.chats[id];save();closeModal();document.getElementById('chatview').classList.remove('show');render();toast('角色已删除')}}}
async function send(){let input=document.getElementById('input'),text=input.value.trim();if(!text||!current)return;state.chats[current]??=[];state.chats[current].push({role:'user',content:text});input.value='';save();renderMessages();let c=state.chars.find(x=>x.id===current);if(!state.settings.apiKey){setTimeout(()=>{state.chats[current].push({role:'assistant',content:'已收到。请在「我 → API 与模型」配置 API 后启用真实 AI 回复。'});save();renderMessages()},300);return}try{let r=await fetch(state.settings.apiBase+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.settings.apiKey},body:JSON.stringify({model:state.settings.model,messages:[{role:'system',content:c.description||'请保持角色一致并进行自然对话。'},...state.chats[current].map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}))]})});let d=await r.json();state.chats[current].push({role:'assistant',content:d.choices?.[0]?.message?.content||'API 没有返回内容。'});save();renderMessages()}catch(e){state.chats[current].push({role:'assistant',content:'API 请求失败：'+e.message});save();renderMessages()}}
document.getElementById('send').onclick=send;document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('add').onclick=()=>document.getElementById('jsonpick').click();document.getElementById('search').onclick=()=>toast('搜索功能');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{page=x.dataset.page;render()});render();
</script></body></html>
