<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>小手机</title><style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17181b;--muted:#8b8d93;--line:#e7e7eb;--green:#07c160;--blue:#3478f6;--shadow:0 12px 40px #00000012}*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}.app{width:min(100vw,430px);height:100dvh;margin:auto;background:var(--bg);overflow:hidden;position:relative}.screen{height:100%;display:none;flex-direction:column}.screen.active{display:flex}.top{height:58px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:end;justify-content:space-between;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);z-index:3}.title{font-size:18px;font-weight:700}.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:22px}.content{flex:1;overflow:auto}.nav{height:68px;padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--line);z-index:4}.nav button{flex:1;border:0;background:none;color:#8d8f95;font-size:11px}.nav button b{display:block;font-size:23px;line-height:26px;font-weight:500}.nav button.on{color:#111}.nav button.on b{font-weight:700}.listrow{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);gap:12px}.avatar{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#dfe3e8;display:grid;place-items:center;font-size:22px;flex:none}.rowmain{min-width:0;flex:1}.rowtitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowsub{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{color:#bbb;font-size:22px}.empty{text-align:center;color:var(--muted);padding:80px 30px}.hero{padding:28px 18px 20px;background:var(--card);border-bottom:1px solid var(--line)}.profile{display:flex;align-items:center;gap:14px}.bigavatar{width:68px;height:68px;border-radius:14px;background:#ddd;display:grid;place-items:center;font-size:30px;overflow:hidden}.bigavatar img,.avatar img{width:100%;height:100%;object-fit:cover}.section{margin-top:18px}.sectiontitle{padding:0 16px 8px;color:var(--muted);font-size:12px}.card{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.setting{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}.setting:last-child{border-bottom:0}.setting .ico{width:26px;text-align:center;font-size:19px}.setting .label{flex:1}.setting small{color:var(--muted)}.switch{width:46px;height:27px;border-radius:99px;background:#d5d7dc;position:relative}.switch i{position:absolute;width:23px;height:23px;background:white;border-radius:50%;top:2px;left:2px;box-shadow:0 1px 4px #0002;transition:.2s}.switch.on{background:#34c759}.switch.on i{left:21px}.chathead{height:58px;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;display:flex;align-items:end;background:var(--card);border-bottom:1px solid var(--line)}.chathead .name{flex:1;text-align:center;font-weight:650}.back{border:0;background:none;font-size:25px}.messages{flex:1;overflow:auto;padding:16px 12px;background-size:cover;background-position:center;position:relative}.messages:before{content:"";position:absolute;inset:0;background:var(--shade,transparent);pointer-events:none}.bubble{position:relative;max-width:76%;padding:10px 12px;border-radius:7px;margin:7px 0;line-height:1.55;font-size:15px;word-break:break-word}.bubble.ai{background:#fff;align-self:flex-start}.bubble.me{background:#95ec69;align-self:flex-end}.msg{display:flex}.msg.me{justify-content:flex-end}.composer{padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--card);border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:100px}.send{border:0;border-radius:8px;background:var(--green);color:white;padding:0 14px}.cover{height:210px;background:#cfd3d8 center/cover;position:relative}.cover .covername{position:absolute;right:18px;bottom:18px;color:#fff;font-weight:700;text-shadow:0 1px 5px #000}.feed{padding:18px 16px;background:var(--card);border-bottom:1px solid var(--line)}.feedtop{display:flex;gap:10px}.feedbody{margin:10px 0 0 58px;line-height:1.55}.feedactions{margin:10px 0 0 58px;color:#576b95}.sheet{position:absolute;inset:0;background:#0005;display:none;align-items:end;z-index:20}.sheet.show{display:flex}.sheetbox{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));max-height:88%;overflow:auto}.sheettitle{text-align:center;padding:12px;font-weight:700}.sheetitem{padding:15px 20px;border-top:1px solid var(--line)}.danger{color:#e53935}.modal{position:absolute;inset:0;background:#0005;display:none;align-items:center;justify-content:center;z-index:30}.modal.show{display:flex}.modalbox{width:86%;max-height:86%;overflow:auto;background:var(--card);border-radius:16px;padding:18px}.modalbox h3{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg)}.btn{border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff}.btn.light{background:var(--bg);color:var(--text)}.btn.green{background:var(--green)}.btn.danger{background:#fff0f0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.resource{padding:16px;border-bottom:1px solid var(--line);background:var(--card)}.resource strong{display:block}.tag{display:inline-block;background:#eef1f6;border-radius:20px;padding:4px 8px;font-size:11px;color:#667;margin:5px 5px 0 0}.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 13px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.dark{--bg:#101114;--card:#1b1c20;--text:#f2f2f5;--muted:#9698a0;--line:#303238}.dark .bubble.ai{background:#2a2b30}.dark .bubble.me{background:#315a35}.dark .setting,.dark .listrow{background:var(--card)}
</style></head><body><main class="app" id="app"></main><script>
const $=(s)=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=JSON.parse(localStorage.getItem('miniFinalDB')||'null')||{dark:false,bg:'',shade:.12,api:{base:'',key:'',model:''},chars:[],feeds:[],resources:{presets:[],regex:[],worldbooks:[]}};let current=null,screen='chat';
function save(){localStorage.setItem('miniFinalDB',JSON.stringify(db));}
function icon(x){return `<b>${x}</b>`}
function layout(body,title,actions=''){return `<section class="screen active"><header class="top"><span class="title">${title}</span><span>${actions}</span></header><div class="content">${body}</div>${nav()}</section>`}
function nav(){return `<nav class="nav"><button class="${screen==='chat'?'on':''}" onclick="go('chat')">${icon('⌂')}聊天</button><button class="${screen==='feed'?'on':''}" onclick="go('feed')">${icon('◎')}朋友圈</button><button class="${screen==='me'?'on':''}" onclick="go('me')">${icon('●')}我</button></nav>`}
function render(){document.body.classList.toggle('dark',db.dark);if(screen==='chat') renderChat();if(screen==='feed') renderFeed();if(screen==='me') renderMe();}
function go(s){screen=s;current=null;render()}
function renderChat(){let rows=db.chars.map((c,i)=>`<div class="listrow" onclick="openChat(${i})"><div class="avatar">${c.avatar?`<img src="${c.avatar}">`:'👤'}</div><div class="rowmain"><div class="rowtitle">${esc(c.name)}</div><div class="rowsub">${esc(c.last||c.desc||'开始聊天')}</div></div><span class="chev">›</span></div>`).join('');$('#app').innerHTML=layout(rows||`<div class="empty"><div style="font-size:42px">💬</div><p>还没有角色</p><button class="btn" onclick="openImport()">导入角色卡</button></div>`,'聊天',`<button class="iconbtn" onclick="openImport()">＋</button>`);}
function openChat(i){current=i;renderConversation()}
function renderConversation(){let c=db.chars[current];let bg=db.bg?`background-image:url('${db.bg}')`:'',msgs=(c.msgs||[]).map(m=>`<div class="msg ${m.me?'me':''}"><div class="bubble ${m.me?'me':'ai'}">${esc(m.text).replace(/\n/g,'<br>')}</div></div>`).join('');$('#app').innerHTML=`<section class="screen active"><header class="chathead"><button class="back" onclick="render()">‹</button><span class="name">${esc(c.name)}</span><button class="iconbtn" onclick="chatMenu()">···</button></header><div class="messages" style="${bg};--shade:rgba(0,0,0,${db.shade})" id="msgs">${msgs||'<div class="empty">开始和角色聊天</div>'}</div><div class="composer"><textarea id="input" rows="1" placeholder="输入消息…"></textarea><button class="send" onclick="sendMsg()">发送</button></div></section>`;setTimeout(()=>{$('#msgs').scrollTop=999999},0)}
function sendMsg(){let v=$('#input').value.trim();if(!v)return;let c=db.chars[current];c.msgs=c.msgs||[];c.msgs.push({me:true,text:v});c.last=v;save();renderConversation();if(db.api.base&&db.api.key)callAPI(v);else setTimeout(()=>{c.msgs.push({text:'已收到。你可以在「设置 → API」配置模型后启用真实 AI 回复。'});save();renderConversation()},350)}
async function callAPI(v){let c=db.chars[current];try{let r=await fetch(db.api.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+db.api.key},body:JSON.stringify({model:db.api.model||'gpt-4o-mini',messages:[{role:'system',content:c.system||c.desc||''},...(c.msgs||[]).map(m=>({role:m.me?'user':'assistant',content:m.text})).slice(-30),{role:'user',content:v}]})});let j=await r.json();let t=j.choices?.[0]?.message?.content||'模型没有返回内容';c.msgs.push({text:t});save();renderConversation()}catch(e){c.msgs.push({text:'API 请求失败：'+e.message});save();renderConversation()}}
function chatMenu(){openSheet([{t:'角色资料',f:`openChar(${current})`},{t:'聊天背景',f:'openBg()'},{t:'清空聊天记录',f:'clearChat()'},{t:'删除角色',f:'deleteChar()',danger:true}])}
function openChar(i){closeSheet();let c=db.chars[i];openModal(`<h3>角色资料</h3><div class="profile"><div class="bigavatar">${c.avatar?`<img src="${c.avatar}">`:'👤'}</div><div><b>${esc(c.name)}</b><div style="color:var(--muted);margin-top:5px">${esc(c.desc||'')}</div></div></div><div class="actions"><button class="btn danger" onclick="deleteChar(${i})">删除角色</button><button class="btn light" onclick="closeModal()">关闭</button></div>`)}
function deleteChar(i=current){let c=db.chars[i];if(!c)return;if(confirm(`确定删除「${c.name}」吗？聊天记录也会一起删除。`)){db.chars.splice(i,1);save();closeModal();closeSheet();screen='chat';current=null;render()}}
function clearChat(){closeSheet();if(confirm('清空当前聊天记录？')){db.chars[current].msgs=[];save();renderConversation()}}
function renderFeed(){let feeds=db.feeds.map(f=>`<article class="feed"><div class="feedtop"><div class="avatar">👤</div><div><b>${esc(f.name||'角色')}</b><div class="rowsub">刚刚</div></div></div><div class="feedbody">${esc(f.text)}</div><div class="feedactions">♡ 赞　　💬 评论</div></article>`).join('');$('#app').innerHTML=layout(`<div style="padding:12px 16px"><button class="btn green" onclick="publishFeed()">＋ 发布动态</button></div>${feeds||'<div class="empty">还没有朋友圈动态</div>'}`,'朋友圈')}
function publishFeed(){openModal(`<h3>发布朋友圈</h3><div class="field"><textarea id="feedtext" rows="5" placeholder="分享此刻…"></textarea></div><div class="actions"><button class="btn light" onclick="closeModal()">取消</button><button class="btn green" onclick="saveFeed()">发表</button></div>`)}
function saveFeed(){let t=$('#feedtext').value.trim();if(!t)return;db.feeds.unshift({name:'我',text:t});save();closeModal();renderFeed()}
function renderMe(){let c=db.chars.length,r=db.resources;$('#app').innerHTML=layout(`<div class="hero"><div class="profile"><div class="bigavatar">👤</div><div><div style="font-size:19px;font-weight:700">我的小手机</div><div style="color:var(--muted);margin-top:4px">沉浸式文游空间</div></div></div></div><div class="section"><div class="sectiontitle">文游资源</div><div class="card"><div class="setting" onclick="resourceManager('chars')"><span class="ico">👤</span><span class="label">角色卡</span><small>${c} 个　›</small></div><div class="setting" onclick="resourceManager('worldbooks')"><span class="ico">📚</span><span class="label">世界书</span><small>${r.worldbooks.length} 个　›</small></div><div class="setting" onclick="resourceManager('presets')"><span class="ico">⚙︎</span><span class="label">预设</span><small>${r.presets.length} 个　›</small></div><div class="setting" onclick="resourceManager('regex')"><span class="ico">⌘</span><span class="label">正则</span><small>${r.regex.length} 个　›</small></div></div></div><div class="section"><div class="sectiontitle">设置</div><div class="card"><div class="setting" onclick="openBg()"><span class="ico">🖼</span><span class="label">聊天背景</span><small>›</small></div><div class="setting" onclick="toggleDark()"><span class="ico">☾</span><span class="label">暗夜模式</span><span class="switch ${db.dark?'on':''}"><i></i></span></div><div class="setting" onclick="apiSettings()"><span class="ico">⌁</span><span class="label">API 与模型</span><small>${esc(db.api.model||'未配置')}　›</small></div><div class="setting" onclick="exportData()"><span class="ico">⇩</span><span class="label">导出本地数据</span><small>›</small></div></div></div>`,'我');}
function toggleDark(){db.dark=!db.dark;save();render()}
function openBg(){closeSheet();openModal(`<h3>聊天背景</h3><div class="field"><label>选择图片</label><input type="file" id="bgfile" accept="image/*"></div><div class="field"><label>背景压暗</label><input type="range" id="shade" min="0" max="0.6" step="0.02" value="${db.shade}"></div><div class="actions"><button class="btn light" onclick="db.bg='';save();closeModal();render()">恢复默认</button><button class="btn green" onclick="saveBg()">使用此背景</button></div>`)}
function saveBg(){let f=$('#bgfile').files[0];db.shade=+$('#shade').value;if(f){let rd=new FileReader();rd.onload=()=>{db.bg=rd.result;save();closeModal();render()};rd.readAsDataURL(f)}else{save();closeModal();render()}}
function apiSettings(){openModal(`<h3>API 与模型</h3><div class="field"><label>Base URL</label><input id="base" value="${esc(db.api.base)}" placeholder="https://api.example.com/v1"></div><div class="field"><label>API Key</label><input id="key" type="password" value="${esc(db.api.key)}"></div><div class="field"><label>Model</label><input id="model" value="${esc(db.api.model)}" placeholder="模型名称"></div><div class="actions"><button class="btn light" onclick="closeModal()">取消</button><button class="btn green" onclick="saveApi()">保存</button></div>`)}
function saveApi(){db.api={base:$('#base').value.trim(),key:$('#key').value.trim(),model:$('#model').value.trim()};save();closeModal();render()}
function openImport(){openModal(`<h3>导入角色卡</h3><div class="field"><label>支持 JSON 角色卡，也支持导入你的文游资源预设</label><input type="file" id="importfile" accept=".json,application/json"></div><div style="color:var(--muted);font-size:12px;line-height:1.6">如果文件是预设/正则/世界书资源，会自动识别并放入对应资源库，不会把它误当成角色。</div><div class="actions"><button class="btn light" onclick="closeModal()">取消</button><button class="btn green" onclick="doImport()">导入</button></div>`)}
function doImport(){let f=$('#importfile').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);ingest(d,f.name);closeModal();render()}catch(e){alert('JSON 解析失败：'+e.message)}};rd.readAsText(f)}
function ingest(d,name){let prompts=d.prompts||[];let ext=d.extensions||{};let regex=ext.regex_scripts||[];if(d.name||prompts.length){db.resources.presets.push({name:d.name||name,source:name,prompts:prompts.length,raw:d});if(regex.length)db.resources.regex.push(...regex.map(x=>({...x,source:name})));let worldPrompts=prompts.filter(p=>/world|世界|lore/i.test((p.identifier||'')+' '+(p.name||''))&&p.content);if(worldPrompts.length)db.resources.worldbooks.push({name:(d.name||name)+' · 世界模块',source:name,entries:worldPrompts.map(p=>({name:p.name,content:p.content,enabled:p.enabled,position:p.injection_position,depth:p.injection_depth}))});if(prompts.length===0&&d.name)toast('已导入资源');else if(worldPrompts.length===0)toast('已导入预设/正则；此文件未包含实际世界书条目')}else if(d.name||d.description||d.data){db.chars.push({name:d.name||'新角色',desc:d.description||d.personality||'',system:d.system_prompt||d.system||'',msgs:[],last:''});save();toast('角色已导入')}else toast('未识别的资源格式');save()}
function resourceManager(type){let title={chars:'角色卡',worldbooks:'世界书',presets:'预设',regex:'正则'}[type];let arr=type==='chars'?db.chars:db.resources[type];let html=arr.length?arr.map((x,i)=>`<div class="resource"><strong>${esc(x.name||x.scriptName||'未命名')}</strong><span class="tag">${type==='regex'?'Regex':type==='worldbooks'?'Lorebook':type==='presets'?'Preset':'Character'}</span><div class="actions"><button class="btn light" onclick="closeModal();${type==='chars'?`openChar(${i})`:''}">查看</button><button class="btn danger" onclick="removeResource('${type}',${i})">删除</button></div></div>`).join(''):'<div class="empty">暂无资源</div>';openModal(`<h3>${title}</h3>${html}<div class="actions"><button class="btn light" onclick="closeModal()">关闭</button></div>`)}
function removeResource(type,i){if(!confirm('确定删除这个资源吗？'))return;if(type==='chars')db.chars.splice(i,1);else db.resources[type].splice(i,1);save();closeModal();resourceManager(type)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mini-phone-data.json';a.click();URL.revokeObjectURL(a.href)}
function openSheet(items){let el=document.createElement('div');el.className='sheet show';el.id='sheet';el.innerHTML='<div class="sheetbox"><div class="sheettitle">更多</div>'+items.map(x=>`<div class="sheetitem ${x.danger?'danger':''}" onclick="${x.f}">${x.t}</div>`).join('')+'<div class="sheetitem" onclick="closeSheet()">取消</div></div>';$('#app').appendChild(el)}function closeSheet(){$('#sheet')?.remove()}
function openModal(html){let el=document.createElement('div');el.className='modal show';el.id='modal';el.innerHTML='<div class="modalbox">'+html+'</div>';$('#app').appendChild(el)}function closeModal(){$('#modal')?.remove()}function toast(t){let e=document.createElement('div');e.className='toast show';e.textContent=t;$('#app').appendChild(e);setTimeout(()=>e.remove(),1800)}
render();
</script></body></html>
