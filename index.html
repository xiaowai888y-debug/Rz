<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小手机</title><meta name="theme-color" content="#ededed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#e9edf0}
button,input,textarea{font:inherit}button{cursor:pointer}
:root{--bg:#f7f7f7;--bar:#ededed;--card:#fff;--text:#111;--muted:#8b8b8b;--line:#ddd;--green:#07c160;--bubble:#fff;--me:#95ec69}
:root.dark{--bg:#111;--bar:#191919;--card:#191919;--text:#eee;--muted:#8b8b8b;--line:#2b2b2b;--bubble:#262626}
body.darkpage{background:#070707}
.app{min-height:100vh;display:grid;place-items:center;padding:20px}
.phone{width:min(430px,100%);height:min(900px,calc(100vh - 40px));min-height:650px;border:9px solid #151515;border-radius:40px;overflow:hidden;background:var(--bg);box-shadow:0 30px 90px #0004;position:relative}
.status{height:31px;background:var(--bar);color:var(--text);display:flex;justify-content:space-between;align-items:center;padding:0 17px;font-size:12px}
.header{height:52px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--text)}
.title{font-size:18px;font-weight:650}.icon{border:0;background:transparent;color:var(--text);font-size:22px;padding:5px}.screen{height:calc(100% - 133px);overflow:auto;background:var(--bg)}
.tabs{height:50px;background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.tab{border:0;background:none;color:var(--muted)}.tab.active{color:var(--green);font-weight:700}
.chat-item{display:flex;gap:11px;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--card);color:var(--text)}.avatar{width:48px;height:48px;border-radius:7px;background:#d8dde2;display:grid;place-items:center;overflow:hidden;flex:none;font-size:22px}.avatar img{width:100%;height:100%;object-fit:cover}.main{flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:650}.time,.preview{color:var(--muted);font-size:12px}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{height:100%;display:flex;flex-direction:column;background-size:cover;background-position:center;position:relative}.chat:before{content:"";position:absolute;inset:0;background:var(--overlay,transparent);pointer-events:none}.messages{flex:1;overflow:auto;padding:12px;position:relative;z-index:1}.msg{display:flex;gap:8px;margin:11px 0}.msg.me{justify-content:flex-end}.bubble{max-width:76%;padding:9px 11px;border-radius:7px;background:var(--bubble);color:var(--text);white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px #0001}.me .bubble{background:var(--me);color:#111}.typing{font-size:12px;color:var(--muted);padding:5px 2px}
.composer{display:flex;gap:7px;padding:8px;background:var(--bar);border-top:1px solid var(--line);position:relative;z-index:2}.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--card);color:var(--text)}.send{width:54px;border:0;border-radius:7px;background:var(--green);color:#fff}
.cover{height:135px;background:linear-gradient(135deg,#55616d,#adb5bc);position:relative}.profile{position:absolute;right:14px;bottom:-25px;display:flex;gap:10px;align-items:center;color:white}.profile .avatar{border:3px solid white}.feed{padding:42px 14px 20px}.post{display:flex;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.postbody{flex:1;color:var(--text)}.posttext{white-space:pre-wrap;line-height:1.55}.postmeta{color:var(--muted);font-size:12px;margin-top:7px}.actions{margin-top:8px;display:flex;gap:8px}.actions button{border:0;background:#eef1f4;border-radius:5px;padding:4px 8px;font-size:12px}
.panel{position:absolute;inset:31px 0 50px;background:var(--bg);z-index:10;color:var(--text);overflow:auto}.panelhead{height:54px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}.panelhead h2{font-size:18px;margin:0}.section{color:var(--muted);font-size:12px;padding:15px 15px 7px}.setting{min-height:53px;background:var(--card);border-bottom:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between}.setting .left{display:flex;gap:10px;align-items:center}.chev{color:var(--muted);font-size:21px}.switch{width:45px;height:26px;border:0;border-radius:20px;background:#aaa;position:relative}.switch.on{background:var(--green)}.switch:after{content:"";width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.15s}.switch.on:after{left:21px}.form{padding:14px}.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}.field textarea{min-height:100px;resize:vertical}.primary,.secondary{border-radius:8px;padding:10px 13px}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text);margin-left:7px}.preview{height:130px;border-radius:10px;border:1px solid var(--line);background:#e1e4e7 center/cover no-repeat;margin-bottom:12px}.empty{text-align:center;color:var(--muted);padding:55px 20px}.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:white;padding:8px 12px;border-radius:8px;font-size:12px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}
@media(max-width:500px){.app{padding:0}.phone{width:100%;height:100vh;min-height:0;border:0;border-radius:0}}
</style>
</head>
<body>
<div class="app"><div class="phone" id="phone"></div></div>
<script>
const KEY="mini_phone_v3";
const state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 settings:{dark:false,wallpaper:"",dim:0,baseUrl:"https://api.openai.com/v1",apiKey:"",model:"gpt-4o-mini",nickname:"我"},
 chars:[
  {id:"demo",name:"示例角色",avatar:"🧑",description:"一个用于体验的小角色。",system:"你是一个自然、友好的聊天角色，请保持角色设定，用中文交流。"}
 ],
 chats:{demo:[{role:"assistant",content:"你好。这里是小手机的第三版原型。你可以从设置里换聊天背景，也可以打开暗夜模式。",time:"刚刚"}]},
 posts:[{id:1,name:"系统",avatar:"📱",text:"欢迎来到小手机。这里以后会越来越像一台真正的手机。",time:"刚刚",likes:0}]
};
let tab="chat",chatId=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){
 document.documentElement.classList.toggle("dark",state.settings.dark);
 document.body.classList.toggle("darkpage",state.settings.dark);
 const phone=document.getElementById("phone");
 phone.innerHTML=`<div class="status"><span>${new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}</span><span>▮▮▮　⌁</span></div>
 <div class="header"><span class="title">${chatId?esc(getChar().name):tab==="chat"?"微信":"朋友圈"}</span><button class="icon" onclick="${chatId?"back()":"settings()"}">${chatId?"‹":"⚙"}</button></div>
 <div class="screen">${chatId?chatView():tab==="chat"?chatList():moments()}</div>
 <div class="tabs"><button class="tab ${tab==="chat"?"active":""}" onclick="switchTab('chat')">💬 聊天</button><button class="tab ${tab==="moments"?"active":""}" onclick="switchTab('moments')">◎ 朋友圈</button></div>
 <div id="panel"></div><div id="toast" class="toast"></div>`;
}
function getChar(){return state.chars.find(c=>c.id===chatId)}
function switchTab(t){tab=t;chatId=null;render()}
function back(){chatId=null;render()}
function chatList(){
 return state.chars.map(c=>{const a=state.chats[c.id]||[],m=a[a.length-1];return `<div class="chat-item" onclick="openChat('${c.id}')"><div class="avatar">${esc(c.avatar||"👤")}</div><div class="main"><div class="row"><span class="name">${esc(c.name)}</span><span class="time">${esc(m?.time||"")}</span></div><div class="preview">${esc(m?.content||c.description||"点击聊天")}</div></div></div>`}).join("")+
 `<div class="empty"><button class="secondary" onclick="importChar()">＋ 导入角色卡</button></div>`;
}
function openChat(id){chatId=id;if(!state.chats[id])state.chats[id]=[];render()}
function chatView(){
 const c=getChar(),arr=state.chats[c.id]||[],w=state.settings.wallpaper,ov=w?`rgba(0,0,0,${state.settings.dim||0})`:"transparent";
 return `<div class="chat" style="${w?`background-image:url('${w}');--overlay:${ov}`:""}"><div class="messages" id="messages">
 ${arr.map(m=>`<div class="msg ${m.role==="user"?"me":""}"><div class="bubble">${esc(m.content)}</div></div>`).join("")}
 </div><div class="composer"><textarea id="input" rows="2" placeholder="输入消息…"></textarea><button class="send" onclick="send()">发送</button></div></div>`;
}
async function send(){
 const input=document.getElementById("input"),text=input.value.trim();if(!text)return;
 const c=getChar(),arr=state.chats[c.id];arr.push({role:"user",content:text,time:"刚刚"});save();render();
 try{
  const headers={"Content-Type":"application/json"};if(state.settings.apiKey)headers.Authorization="Bearer "+state.settings.apiKey;
  const body={model:state.settings.model,messages:[{role:"system",content:c.system||c.description||""},...arr.map(x=>({role:x.role==="user"?"user":"assistant",content:x.content}))],temperature:.8};
  const r=await fetch(state.settings.baseUrl.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json();arr.push({role:"assistant",content:d.choices?.[0]?.message?.content||"（没有返回内容）",time:"刚刚"});save();render();
 }catch(e){arr.push({role:"assistant",content:"⚠️ API 请求失败\n"+e.message,time:"刚刚"});save();render()}
}
function moments(){return `<div class="cover"><div class="profile"><span>${esc(state.settings.nickname)}</span><div class="avatar">🙂</div></div></div><div class="feed">${state.posts.map(p=>`<div class="post"><div class="avatar">${esc(p.avatar||"👤")}</div><div class="postbody"><b>${esc(p.name)}</b><div class="posttext">${esc(p.text)}</div><div class="postmeta">${esc(p.time||"刚刚")}</div><div class="actions"><button onclick="like(${p.id})">♡ ${p.likes||0}</button></div></div></div>`).join("")}<div style="padding:16px 0"><button class="secondary" onclick="post()">＋ 发朋友圈</button></div></div>`}
function like(id){const p=state.posts.find(x=>x.id===id);p.likes=(p.likes||0)+1;save();render()}
function post(){const t=prompt("写点什么？");if(!t)return;state.posts.unshift({id:Date.now(),name:state.settings.nickname,avatar:"🙂",text:t,time:"刚刚",likes:0});save();render()}
function settings(){document.getElementById("panel").innerHTML=`<div class="panel"><div class="panelhead"><button class="icon" onclick="closePanel()">‹</button><h2>设置</h2></div>
<div class="section">通用</div><div class="setting"><div class="left">🌙 <span>暗夜模式</span></div><button class="switch ${state.settings.dark?"on":""}" onclick="darkToggle()"></button></div>
<div class="setting" onclick="appearance()"><div class="left">🎨 <span>聊天背景</span></div><span class="chev">›</span></div>
<div class="section">聊天与角色</div><div class="setting" onclick="apiSettings()"><div class="left">🤖 <span>API 与模型</span></div><span class="chev">›</span></div>
<div class="setting" onclick="importChar()"><div class="left">👤 <span>导入角色卡</span></div><span class="chev">›</span></div>
<div class="section">数据</div><div class="setting" onclick="exportData()"><div class="left">📦 <span>导出全部数据</span></div><span class="chev">›</span></div></div>`}
function closePanel(){document.getElementById("panel").innerHTML=""}
function darkToggle(){state.settings.dark=!state.settings.dark;save();render();settings()}
function appearance(){
 const w=state.settings.wallpaper;
 document.getElementById("panel").innerHTML=`<div class="panel"><div class="panelhead"><button class="icon" onclick="settings()">‹</button><h2>聊天背景</h2></div><div class="form">
 <div class="preview" id="wp" style="${w?`background-image:url('${w}')`:""}"></div>
 <div class="field"><label>从相册选择</label><input id="file" type="file" accept="image/*"></div>
 <div class="field"><label>背景压暗</label><input id="dim" type="range" min="0" max=".7" step=".05" value="${state.settings.dim}" oninput="dimPreview(this.value)"></div>
 <button class="primary" onclick="saveWallpaper()">使用这张图片</button><button class="secondary" onclick="resetWallpaper()">恢复默认</button>
 <p style="color:var(--muted);font-size:12px;line-height:1.5">图片只保存在本机浏览器。后续可以继续加入“为所有聊天设置 / 为当前聊天设置 / 预设图库”等微信式流程。</p>
 </div></div>`;
}
function dimPreview(v){state.settings.dim=Number(v);const p=document.getElementById("wp");p.style.boxShadow=`inset 0 0 0 999px rgba(0,0,0,${v})`}
function saveWallpaper(){const f=document.getElementById("file").files[0];state.settings.dim=Number(document.getElementById("dim").value);if(!f){save();settings();return}const r=new FileReader();r.onload=()=>{state.settings.wallpaper=r.result;save();toast("聊天背景已更换");settings()};r.readAsDataURL(f)}
function resetWallpaper(){state.settings.wallpaper="";state.settings.dim=0;save();toast("已恢复默认");settings()}
function apiSettings(){document.getElementById("panel").innerHTML=`<div class="panel"><div class="panelhead"><button class="icon" onclick="settings()">‹</button><h2>API 与模型</h2></div><div class="form">
<div class="field"><label>API Base URL</label><input id="base" value="${esc(state.settings.baseUrl)}"></div><div class="field"><label>API Key</label><input id="key" type="password" value="${esc(state.settings.apiKey)}"></div><div class="field"><label>模型</label><input id="model" value="${esc(state.settings.model)}"></div><div class="field"><label>昵称</label><input id="nick" value="${esc(state.settings.nickname)}"></div><button class="primary" onclick="saveApi()">保存</button></div></div>`}
function saveApi(){state.settings.baseUrl=document.getElementById("base").value.trim();state.settings.apiKey=document.getElementById("key").value.trim();state.settings.model=document.getElementById("model").value.trim();state.settings.nickname=document.getElementById("nick").value.trim()||"我";save();toast("已保存");settings()}
function importChar(){document.getElementById("panel").innerHTML=`<div class="panel"><div class="panelhead"><button class="icon" onclick="settings()">‹</button><h2>导入角色卡</h2></div><div class="form"><div class="field"><label>JSON 文件</label><input id="cf" type="file" accept=".json,application/json"></div><div class="field"><label>或粘贴 JSON</label><textarea id="cj" placeholder='{"name":"角色名","description":"...","system":"..."}'></textarea></div><button class="primary" onclick="doImport()">导入</button></div></div>`}
function doImport(){const f=document.getElementById("cf").files[0],t=document.getElementById("cj").value.trim();if(f){const r=new FileReader();r.onload=()=>parseChar(r.result);r.readAsText(f)}else if(t)parseChar(t);else toast("请选择文件")}
function parseChar(t){try{let x=JSON.parse(t);x=x.data||x;const c={id:"c"+Date.now(),name:x.name||x.char_name||"未命名角色",avatar:x.avatar||"👤",description:x.description||x.personality||"",system:x.system||x.system_prompt||[x.description,x.personality,x.scenario,x.example_dialogue].filter(Boolean).join("\\n\\n")||"请按照角色设定与用户自然交流。"};state.chars.push(c);state.chats[c.id]=[];save();closePanel();render();toast("角色卡已导入")}catch(e){toast("JSON 无法解析")}}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="mini-phone-data.json";a.click()}
function toast(s){const t=document.getElementById("toast");if(!t)return;t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400)}
render();
</script>
</body></html>
